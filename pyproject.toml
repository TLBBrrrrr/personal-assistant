[project]
name = "personal-assistant"
version = "0.1.0"
description = "本地优先、模型可插拔、带长期记忆的个人 Agent 骨架"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim>=0.6",
    "litellm>=1.75",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
assistant = "assistant.cli:main"
assistant-api = "assistant.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
include = ["src/assistant/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
